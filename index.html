<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>餐飲數據後台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* ===== 設計 token（暖米色／橘色風格，白天 + 黑夜） ===== */
  :root {
    --bg: #f7f3ea;
    --surface: #fffcf6;
    --surface-hover: #f5efe3;
    --surface-active: #efe7d8;
    --panel: #f8f2e7;
    --menu: rgba(255, 252, 246, 0.98);
    --field-inset: rgba(239, 231, 216, 0.72);
    --text: #171717;
    --text-medium: rgba(23, 23, 23, 0.72);
    --text-muted: rgba(23, 23, 23, 0.56);
    --text-soft: rgba(23, 23, 23, 0.46);
    --border: #eee6db;
    --border-strong: #e1d7c8;
    --accent: #ec7d43;
    --accent-ink: #b9531f;
    --accent-soft: rgba(236, 125, 67, 0.1);
    --accent-fill-ink: #3f2112;
    --success: #2f7d4f; --success-soft: rgba(47, 125, 79, 0.12);
    --error: #c2410c;   --error-soft: rgba(194, 65, 12, 0.11);
    --shadow-surface: inset 0 7px 14px rgba(88,72,49,.045), inset 0 .5px .5px rgba(255,255,255,.92), inset 1px 0 0 rgba(88,72,49,.026), inset -1px 0 0 rgba(255,255,255,.68), 0 14px 22px -9px rgba(66,52,33,.11);
    --shadow-soft: inset 0 1px 0 rgba(88,72,49,.045), inset 0 .5px .5px rgba(255,255,255,.86);
    --shadow-menu: 0 22px 44px -26px rgba(66,52,33,.28);
    --shadow-inset: inset 0 1px 10px rgba(88,72,49,.12), inset 0 .5px .5px rgba(255,255,255,.72);
  }
  :root[data-theme="dark"] {
    --bg: #111111;
    --surface: #121212;
    --surface-hover: #161616;
    --surface-active: #202020;
    --panel: #0d0d0d;
    --menu: rgba(18, 18, 18, 0.98);
    --field-inset: rgba(9, 9, 9, 0.75);
    --text: #ededed;
    --text-medium: rgba(237, 237, 237, 0.72);
    --text-muted: rgba(237, 237, 237, 0.6);
    --text-soft: rgba(237, 237, 237, 0.4);
    --border: #232323;
    --border-strong: #343434;
    --accent: #ec5c13;
    --accent-ink: #ff9a63;
    --accent-soft: rgba(236, 92, 19, 0.14);
    --accent-fill-ink: #fff2ea;
    --success: #5fd18b; --success-soft: rgba(95, 209, 139, 0.12);
    --error: #ff8a5c;   --error-soft: rgba(255, 138, 92, 0.12);
    --shadow-surface: inset 0 7px 14px rgba(255,255,255,.03), inset 0 .5px .5px rgba(255,255,255,.06), 0 14px 20px -6px rgba(0,0,0,.45);
    --shadow-soft: inset 0 1px 0 rgba(255,255,255,.045);
    --shadow-menu: 0 22px 42px -22px rgba(0,0,0,.9);
    --shadow-inset: inset 0 1px 10px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    font-size: 14px; -webkit-font-smoothing: antialiased;
    transition: background .3s, color .3s;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  .app { position: relative; z-index: 1; display: flex; height: 100vh; }

  /* ===== 側欄 ===== */
  .sidebar {
    width: 244px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
    transition: width .26s cubic-bezier(.32,.72,0,1);
  }
  .sidebar.collapsed { width: 64px; }
  .ws { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .ws-mark {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center;
    background: var(--accent); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 1px 2px rgba(0,0,0,.2); font-size: 16px;
  }
  .ws-name { font-size: 13.5px; font-weight: 600; line-height: 1.2; white-space: nowrap; }
  .ws-sub { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
  .sidebar.collapsed .ws { justify-content: center; padding: 0; }
  .sidebar.collapsed .ws-text, .sidebar.collapsed .nav-label, .sidebar.collapsed .quota, .sidebar.collapsed .nav-badge { display: none; }

  nav.menu { flex: 1; overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .nav-btn {
    position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px;
    border: 0; border-radius: 9px; background: transparent; color: var(--text-medium);
    font-size: 13.5px; text-align: left; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s;
  }
  .nav-btn:hover { background: var(--surface-hover); color: var(--text); }
  .nav-btn.active { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: var(--shadow-soft), 0 0 0 1px var(--border); }
  .nav-btn.active::before { content: ""; position: absolute; left: -10px; top: 8px; width: 3px; height: 20px; border-radius: 0 3px 3px 0; background: var(--accent); }
  .nav-btn .ico { width: 20px; text-align: center; font-size: 16px; flex-shrink: 0; }
  .nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .nav-badge { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--surface-active); color: var(--text-muted); }
  .sidebar.collapsed .nav-btn { justify-content: center; padding: 0; }

  .side-foot { padding: 10px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .quota { margin-bottom: 10px; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-soft); }
  .quota-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 500; }
  .quota-row span:last-child { color: var(--text-muted); font-weight: 400; }
  .meter { height: 6px; border-radius: 99px; background: var(--surface-active); margin-top: 8px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 82%; border-radius: 99px; background: var(--accent); }
  .quota p { margin-top: 8px; font-size: 11.5px; color: var(--text-muted); }
  .user-row { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .user-text { flex: 1; min-width: 0; line-height: 1.25; }
  .user-text b { display: block; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .user-text small { font-size: 11.5px; color: var(--text-muted); }
  .sidebar.collapsed .user-text { display: none; }
  .sidebar.collapsed .user-row { flex-direction: column; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 9px; border: 0; background: transparent; cursor: pointer;
    display: grid; place-items: center; font-size: 15px; color: var(--text-muted); flex-shrink: 0; transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }

  /* ===== 主區 ===== */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header.top { height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; }
  .crumb .dim { color: var(--text-muted); }
  .crumb .sep { color: var(--text-soft); }
  .crumb b { font-weight: 500; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .pill-range { font-size: 12px; padding: 5px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-soft); color: var(--text-medium); white-space: nowrap; }
  .theme-btn {
    display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-soft);
    font-size: 13px; cursor: pointer; transition: border-color .15s;
  }
  .theme-btn:hover { border-color: var(--accent); }

  main { flex: 1; min-height: 0; overflow-y: auto; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-family: Georgia, "Noto Serif TC", "Songti TC", serif; font-style: italic; font-weight: 700; font-size: 28px; letter-spacing: -.02em; line-height: 1; }
  .sub { margin-top: 8px; font-size: 13px; color: var(--text-muted); }

  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .card, .chart-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-surface);
    animation: rise .45s both; min-width: 0;
  }
  .card { padding: 16px; overflow: hidden; }
  .card-label { font-size: 12.5px; font-weight: 500; color: var(--text-muted); }
  .card-body { margin-top: 12px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .card-value { font-size: 24px; font-weight: 600; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .card-delta { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-soft); flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .chip.good { background: var(--success-soft); color: var(--success); }
  .chip.bad  { background: var(--error-soft); color: var(--error); }
  .spark { flex-shrink: 0; overflow: visible; }

  .charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .chart-box { padding: 16px 16px 12px; }
  .chart-title { font-size: 13.5px; font-weight: 600; }
  .chart-sub { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
  .chart-wrap { position: relative; height: 290px; margin-top: 12px; }
  .note { font-size: 12px; color: var(--text-soft); text-align: center; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (max-width: 1100px) {
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .charts { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .app { flex-direction: column; height: auto; min-height: 100vh; }
    .sidebar, .sidebar.collapsed { width: 100%; flex-direction: row; border-right: 0; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
    .ws, .side-foot { display: none; }
    nav.menu { flex-direction: row; padding: 8px; overflow-x: auto; overflow-y: hidden; gap: 4px; scrollbar-width: none; }
    nav.menu::-webkit-scrollbar { display: none; }
    .sidebar.collapsed .nav-label { display: block; }
    .nav-btn, .sidebar.collapsed .nav-btn { width: auto; flex-shrink: 0; padding: 0 12px; justify-content: flex-start; }
    .nav-btn.active::before { display: none; }
    .content { overflow: visible; }
    main { overflow: visible; }
    header.top { padding: 0 14px; }
    .crumb .dim, .crumb .sep, .pill-range { display: none; }
    .theme-text { display: none; }
    .theme-btn { padding: 0 10px; }
    .wrap { padding: 18px 14px 36px; gap: 16px; }
    h1 { font-size: 24px; }
    .cards { gap: 10px; }
    .card { padding: 14px; }
    .card-value { font-size: 20px; }
    .spark { display: none; }
    .chart-wrap { height: 250px; }
  }
  @media (prefers-reduced-motion: reduce) { .card, .chart-box { animation: none; } .sidebar { transition: none; } }

  /* ===== 首頁：六家門市軌道 ===== */
  [hidden] { display: none !important; }
  #home { max-width: 1180px; margin: 0 auto; padding: 0 24px 56px; }
  .hm-hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: center; gap: 28px; min-height: calc(100vh - 56px - 24px); padding: 24px 0; }
  .hm-hero .hm-in { opacity: 0; }
  .hm-hero.play .hm-in { animation: rise .9s calc(var(--d, 0) * 1ms) cubic-bezier(.2,.8,.2,1) both; }
  .hm-eyebrow { font-size: 11.5px; letter-spacing: .22em; color: var(--text-muted); }
  .hm-title { margin-top: 18px; font-family: Georgia, "Noto Serif TC", "Songti TC", serif; font-style: italic; font-weight: 700; font-size: clamp(46px, 7.2vw, 100px); line-height: 1.06; letter-spacing: -.03em; }
  .hm-title em { position: relative; display: inline-block; font-style: italic; color: var(--accent); }
  .hm-title .ul { position: absolute; left: -2%; bottom: -.1em; width: 104%; height: .2em; overflow: visible; }
  .hm-title .ul path { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .hm-hero.play .hm-title .ul path { animation: draw 1.1s .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .hm-lead { margin-top: 28px; max-width: 30em; font-size: 15.5px; line-height: 1.95; color: var(--text-medium); }
  .hm-lead b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .hm-actions { margin-top: 30px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .btn-main { height: 46px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-fill-ink); font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 12px 24px -12px var(--accent), inset 0 1px 0 rgba(255,255,255,.3); transition: transform .18s, box-shadow .18s; }
  .btn-main:hover { transform: translateY(-2px); box-shadow: 0 16px 28px -12px var(--accent), inset 0 1px 0 rgba(255,255,255,.3); }
  .btn-link { background: none; border: 0; border-bottom: 1px solid var(--border-strong); padding: 0 0 2px; color: var(--text-medium); font-size: 14px; cursor: pointer; transition: color .2s, border-color .2s; }
  .btn-link:hover { color: var(--accent-ink); border-color: var(--accent); }

  .hm-orbit { position: relative; width: 100%; max-width: 560px; aspect-ratio: 1; justify-self: center; }
  .hm-orbit svg { width: 100%; height: 100%; overflow: visible; }
  .ring { fill: none; stroke: var(--border-strong); stroke-dasharray: 2 6; }
  .ring.outer { stroke-dasharray: none; opacity: .7; }
  .ripple { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: 0; transform-origin: center; transform-box: fill-box; animation: ripple 6s linear infinite; }
  .ripple.r2 { animation-delay: 2s; } .ripple.r3 { animation-delay: 4s; }
  @keyframes ripple { 0% { transform: scale(.3); opacity: .55; } 100% { transform: scale(1); opacity: 0; } }
  .node { cursor: pointer; outline: none; }
  .node .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; transition: fill .2s; filter: drop-shadow(0 6px 10px rgba(88,72,49,.18)); }
  .node:hover .dot, .node:focus-visible .dot { fill: var(--accent-soft); stroke-width: 2.6; }
  .node .pip { fill: var(--accent); }
  .n-name { font-size: 16px; font-weight: 600; fill: var(--text); }
  .n-val { font-size: 13px; fill: var(--text-muted); font-family: ui-monospace, Menlo, monospace; }
  .hm-core { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; padding: 0 22%; gap: 6px; pointer-events: none; }
  .hm-core .lab { font-size: 11.5px; letter-spacing: .12em; color: var(--text-muted); }
  .hm-core .num { font-size: clamp(34px, 5.4vw, 60px); font-weight: 600; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
  .hm-core .sub { white-space: pre-line; font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }

  .hm-sec { padding-top: 64px; }
  .hm-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .hm-head h2 { font-family: Georgia, "Noto Serif TC", "Songti TC", serif; font-style: italic; font-size: 24px; letter-spacing: -.01em; }
  .hm-head span { font-size: 11px; letter-spacing: .2em; color: var(--text-soft); }
  .hm-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .hm-card { display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 20px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-surface); cursor: pointer; transition: transform .2s, border-color .2s; }
  .hm-card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .hm-card .tag { align-self: flex-start; font-size: 11px; letter-spacing: .1em; padding: 2px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-ink); }
  .hm-card .k { margin-top: 4px; font-size: 13px; color: var(--text-muted); }
  .hm-card .v { font-size: 30px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .hm-card p { font-size: 13px; line-height: 1.8; color: var(--text-medium); }
  .hm-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .hm-tile { display: flex; align-items: center; gap: 14px; padding: 16px 18px; text-align: left; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); cursor: pointer; transition: background .2s, border-color .2s; }
  .hm-tile:hover { background: var(--surface-hover); border-color: var(--border-strong); }
  .hm-tile .ico { width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center; font-size: 20px; border-radius: 11px; background: var(--accent-soft); }
  .hm-tile b { display: block; font-size: 14.5px; font-weight: 600; }
  .hm-tile small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--text-muted); }
  .hm-tile .ar { margin-left: auto; color: var(--text-soft); transition: transform .2s, color .2s; }
  .hm-tile:hover .ar { transform: translateX(4px); color: var(--accent); }
  .hm-foot { padding-top: 56px; text-align: center; font-size: 12px; color: var(--text-soft); }

  .rv { opacity: 0; transform: translateY(18px); transition: opacity .9s, transform .9s cubic-bezier(.2,.8,.2,1); }
  .rv.in { opacity: 1; transform: none; }
  @media (max-width: 900px) {
    .hm-hero { grid-template-columns: 1fr; min-height: 0; padding: 16px 0 8px; }
    .hm-orbit { max-width: 440px; }
    .hm-grid3, .hm-tiles { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) { #home { padding: 0 14px 40px; } .hm-sec { padding-top: 48px; } .hm-title { font-size: clamp(44px, 14vw, 72px); } }
  @media (prefers-reduced-motion: reduce) { .hm-hero .hm-in { opacity: 1; animation: none !important; } .hm-title .ul path { stroke-dashoffset: 0; animation: none !important; } .ripple { animation: none; } .rv { opacity: 1; transform: none; transition: none; } }
</style>
</head>
<body>
<!-- ===== 暫時密碼閘門（前端遮罩，非真正的資安防護） ===== -->
<div id="gate" style="position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#f6f1e7;font-family:system-ui,-apple-system,'PingFang TC',sans-serif;padding:16px">
  <form id="gateForm" style="background:#fff;border:1px solid #e4dccb;border-radius:16px;padding:32px 28px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)">
    <div style="font-size:34px">🔒</div>
    <h2 style="margin:8px 0 4px;font-size:20px;color:#2b2620">請輸入密碼</h2>
    <p style="margin:0 0 18px;font-size:13px;color:#7a7267">餐飲數據後台示範</p>
    <input id="gatePw" type="password" inputmode="numeric" autocomplete="off" autofocus placeholder="密碼" style="width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d8cfbc;border-radius:10px;font-size:16px;text-align:center;outline:none">
    <button type="submit" style="margin-top:12px;width:100%;padding:12px;border:0;border-radius:999px;background:#ec7d43;color:#fff;font-size:15px;font-weight:600;cursor:pointer">進入</button>
    <div id="gateErr" style="min-height:20px;margin-top:10px;font-size:13px;color:#c0392b"></div>
  </form>
</div>
<script>
(function(){
  var H='f76043a74ec33b6aefbb289050faf7aa8d482095477397e3e63345125d49f527';
  var g=document.getElementById('gate');
  function open(){ g.remove(); document.documentElement.style.overflow=''; }
  try{ if(sessionStorage.getItem('gate-ok')===H){ open(); return; } }catch(e){}
  document.documentElement.style.overflow='hidden';
  function sha(t){
    if(window.crypto&&crypto.subtle){
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){
        return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
      });
    }
    return Promise.resolve('');
  }
  document.getElementById('gateForm').addEventListener('submit',function(e){

      else{ document.getElementById('gateErr').textContent='密碼不正確，請再試一次'; document.getElementById('gatePw').select(); }
    });
  });
})();
</script>

<script>
/* ========== 1. 假資料（固定亂數種子，每次開啟數字一致） ========== */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20261111);
const DAYS = 30;
const sum = a => a.reduce((x, y) => x + y, 0);
const fmt = n => Math.round(n).toLocaleString('zh-TW');
const money = n => 'NT$ ' + fmt(n);

const dates = [], labels = [];
for (let i = DAYS - 1; i >= 0; i--) {

}
const dayFactor = d => { const w = d.getDay(); return (w === 0 || w === 6) ? 1.35 : (w === 5 ? 1.15 : 1); };

const stores = [
  { name: '信義店', base: 98000, ticket: 468, ch: [0.52, 0.16, 0.22, 0.10], food: 32.1, labor: 26.4 },
  { name: '中山店', base: 84000, ticket: 442, ch: [0.48, 0.19, 0.23, 0.10], food: 32.8, labor: 27.2 },
  { name: '板橋店', base: 69000, ticket: 405, ch: [0.41, 0.23, 0.26, 0.10], food: 33.9, labor: 28.1 },
  { name: '汐止店', base: 53000, ticket: 388, ch: [0.38, 0.25, 0.28, 0.09], food: 35.2, labor: 29.6 },
  { name: '台中店', base: 76000, ticket: 412, ch: [0.50, 0.20, 0.19, 0.11], food: 33.0, labor: 27.5 },
  { name: '高雄店', base: 62000, ticket: 396, ch: [0.47, 0.22, 0.21, 0.10], food: 34.4, labor: 28.9 },
];
stores.forEach(s => {
  s.daily = dates.map(d => Math.round(s.base * dayFactor(d) * (0.9 + rnd() * 0.2)));
  s.revenue = sum(s.daily);
  s.orders = Math.round(s.revenue / s.ticket);
});
const dailyRevenue = dates.map((_, i) => sum(stores.map(s => s.daily[i])));
const totalRevenue = sum(dailyRevenue);
const totalOrders = sum(stores.map(s => s.orders));

const channels = ['內用', '外帶', '外送平台', '線上自取'];

const channelDaily = channels.map((_, c) => dates.map((_, i) => Math.round(sum(stores.map(s => s.daily[i] * s.ch[c])))));

const sessions = dates.map(d => Math.round(6400 * (dayFactor(d) * 0.6 + 0.4) * (0.9 + rnd() * 0.2)));

const webOrders = Math.round(totalSessions * 0.0372);

const totalNewMembers = sum(newMembers);
const memberTotal = 48620;

const totalQty = Math.round(totalOrders * 2.4);

const costs = { '食材': 33.4, '人事': 27.8, '租金': 9.6, '平台抽成': 4.3, '水電雜支': 5.2, '行銷': 3.5 };

const profitRate = 100 - costRate;

/* ========== 2. 主題與圖表配色 ========== */
const THEMES = {

  },
};
let theme = 'light';
try { theme = localStorage.getItem('dash-theme-v2') || 'light'; } catch (e) {}
const T = () => THEMES[theme];
const alpha = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* ========== 3. 圖表工廠 ========== */
function basePlugins(showLegend, extra = {}) {
  const t = T();
  return Object.assign({
    legend: { display: showLegend, labels: { color: t.text, boxWidth: 8, boxHeight: 8, usePointStyle: true, padding: 14, font: { size: 12 } } },
    tooltip: { backgroundColor: t.tipBg, titleColor: t.tipText, bodyColor: t.tipText, borderColor: t.grid, borderWidth: 1, padding: 10, cornerRadius: 10 },
  }, extra);
}
function axes(o = {}) {
  const t = T();
  const ax = x => Object.assign({ ticks: { color: t.text, font: { size: 11, family: 'ui-monospace, Menlo, monospace' }, maxRotation: 0, autoSkipPadding: 12 }, grid: { color: t.grid, borderDash: [2, 4] }, border: { display: false } }, x);
  return { x: ax(Object.assign({ grid: { display: false } }, o.x)), y: ax(Object.assign({ beginAtZero: true }, o.y)) };
}
const kTick = v => v >= 10000 ? (v / 10000) + ' 萬' : v;

function lineChart(series, yFmt) {
  const p = T().palette;
  const sc = axes(); sc.y.ticks.callback = yFmt || kTick;
  return {
    type: 'line',
    data: { labels, datasets: series.map((s, i) => ({
      label: s.label, data: s.data, borderColor: p[i], backgroundColor: alpha(p[i], .16),
      fill: i === 0, tension: .35, borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: p[i],
    })) },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: sc, plugins: basePlugins(series.length > 1) },
  };
}
function barChart(cats, series, o = {}) {
  const p = T().palette;
  const sc = axes({ x: { stacked: !!o.stacked }, y: { stacked: !!o.stacked } });
  const va = o.horizontal ? 'x' : 'y';
  sc[va].ticks.callback = o.tick || kTick;
  if (o.horizontal) { sc.x.grid = { color: T().grid, borderDash: [2, 4] }; sc.y.grid = { display: false }; sc.y.ticks.font = { size: 12 }; }
  if (!o.horizontal && cats.length <= 8) sc.x.ticks.autoSkip = false;
  return {
    type: 'bar',
    data: { labels: cats, datasets: series.map((s, i) => ({
      label: s.label, data: s.data, backgroundColor: o.single ? p[0] : p[i],
      borderRadius: o.stacked ? 3 : 6, maxBarThickness: 44,
    })) },
    options: { responsive: true, maintainAspectRatio: false, indexAxis: o.horizontal ? 'y' : 'x', interaction: { mode: 'index', intersect: false }, scales: sc, plugins: basePlugins(series.length > 1) },
  };
}
function doughnut(obj, unit = '%') {
  const t = T();
  const small = window.innerWidth < 520;
  return {
    type: 'doughnut',
    data: { labels: Object.keys(obj), datasets: [{ data: Object.values(obj), backgroundColor: t.palette, borderColor: t.panel, borderWidth: 3, hoverOffset: 6 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '64%',
      plugins: basePlugins(true, {
        legend: { position: small ? 'bottom' : 'right', labels: { color: t.text, boxWidth: 8, boxHeight: 8, usePointStyle: true, padding: 12, font: { size: 12 } } },
        tooltip: Object.assign(basePlugins(true).tooltip, { callbacks: { label: c => ` ${c.label}：${c.parsed}${unit}` } }),
      }),
    },
  };
}

/* ========== 4. 六個區塊 ========== */

const SECTIONS = [

/* ========== 5. 渲染 ========== */
const $ = id => document.getElementById(id);
let current = 'home', liveCharts = [], lastView = null;

// 迷你走勢線：有真實資料就用，否則依漲跌方向產生固定的假走勢
function sparkSVG(values, delta, seed) {
  if (!values) {
    const r = mulberry32(seed * 97 + 13); let v = 50;
    values = Array.from({ length: 14 }, () => (v = Math.max(8, v + (r() - 0.5 + (delta >= 0 ? 0.12 : -0.12)) * 14)));
  }
  const w = 76, h = 30, min = Math.min(...values), max = Math.max(...values);
  const pts = values.map((v, i) => [i / (values.length - 1) * (w - 4) + 2, h - 3 - (v - min) / (max - min || 1) * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="var(--text-soft)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.75" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/></svg>`;
}

function cardHTML([label, value, delta, note, inverse, spark], i) {
  let foot = '';
  if (delta != null) {
    const up = delta > 0, good = inverse ? !up : up;
    const unit = note && note.startsWith('個百分點') ? ' 個百分點' : '%';
    foot = `<span class="chip mono ${good ? 'good' : 'bad'}">${up ? '▲' : '▼'} ${Math.abs(delta)}${unit}</span><span>較前 30 天</span>`;
  } else if (note) foot = `<span>${note}</span>`;
  const sp = delta != null ? sparkSVG(spark, delta, i + current.length) : '';
  return `<article class="card" style="animation-delay:${i * 60}ms">
    <h3 class="card-label">${label}</h3>
    <div class="card-body"><div class="card-value">${value}</div>${sp}</div>
    <div class="card-delta">${foot}</div></article>`;
}

function render() {
  const s = SECTIONS.find(x => x.id === current);
  const isHome = current === 'home', prev = lastView; lastView = current;
  $('crumb').textContent = s.name;
  document.querySelectorAll('.nav-btn').forEach(b => {
    const on = b.dataset.id === current;
    b.classList.toggle('active', on);
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('home').hidden = !isHome; $('dash').hidden = isHome;
  updateParticles();
  if (isHome) { if (prev !== 'home') enterHome(); return; }
  $('title').textContent = s.name;
  $('subtitle').textContent = `${s.sub} · ${labels[0]} – ${labels[DAYS - 1]}，與前 30 天比較`;
  $('cards').innerHTML = s.cards().map(cardHTML).join('');

  liveCharts.forEach(c => c.destroy()); liveCharts = [];
  const charts = s.charts();
  $('charts').innerHTML = charts.map(([t, sub], i) => `<section class="chart-box" style="animation-delay:${200 + i * 80}ms">
      <h2 class="chart-title">${t}</h2><div class="chart-sub">${sub}</div>
      <div class="chart-wrap"><canvas id="chart${i}"></canvas></div></section>`).join('');
  if (window.Chart) {
    charts.forEach(([, , cfg], i) => liveCharts.push(new Chart($('chart' + i), cfg)));
  } else {
    $('charts').querySelectorAll('.chart-wrap').forEach(w => w.innerHTML = '<p class="note">圖表需要網路連線才能載入。</p>');
  }
}

const coreDefault = () => setCore('近 30 天營收', w1(totalRevenue), '萬元 · 六家門市合計');

  ];
  $('home').innerHTML = `
  <section class="hm-hero">
    <div>
      <p class="hm-eyebrow mono hm-in" style="--d:0">SIX STORES · THIRTY DAYS</p>
      <h2 class="hm-title hm-in" style="--d:120" aria-label="每一碗，都算數。">每一碗，<br><em>都算數<svg class="ul" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true"><path d="M3 9 C 60 2, 120 13, 190 6 S 270 4, 297 8" pathLength="1" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/></svg></em>。</h2>
      <p class="hm-lead hm-in" style="--d:260">六家門市、三十天、<b>${fmt(totalOrders)}</b> 筆訂單。<br>我們把每一碗賣出去的故事，整理成一眼就看得懂的數字。</p>
      <div class="hm-actions hm-in" style="--d:400">
        <button class="btn-main" data-go="overall">開始看數據</button>
        <button class="btn-link" data-go="cost">先看成本結構</button>
      </div>
    </div>
    <div class="hm-orbit hm-in" style="--d:300">
      <svg viewBox="-60 -60 720 720" role="img" aria-label="六家門市近 30 天營收，圓越大營收越高">
        <circle class="ring" cx="300" cy="300" r="110"/><circle class="ring" cx="300" cy="300" r="170"/><circle class="ring outer" cx="300" cy="300" r="${ORBIT_R}"/>
        <circle class="ripple r1" cx="300" cy="300" r="250"/><circle class="ripple r2" cx="300" cy="300" r="250"/><circle class="ripple r3" cx="300" cy="300" r="250"/>
        ${stores.map((s, i) => { const r = rOf(s); return `<g class="node" data-i="${i}" tabindex="0" role="link" aria-label="${s.name}，近 30 天營收 ${w1(s.revenue)} 萬元">
          <circle class="dot" r="${r.toFixed(1)}"/><circle class="pip" r="4"/>
          <text class="n-name" y="${(r + 22).toFixed(1)}" text-anchor="middle">${s.name}</text>
          <text class="n-val" y="${(r + 40).toFixed(1)}" text-anchor="middle">${Math.round(s.revenue / 10000)} 萬</text></g>`; }).join('')}
      </svg>
      <div class="hm-core"><span class="lab mono" id="coreLab"></span><span class="num" id="coreNum"></span><span class="sub" id="coreSub"></span></div>
    </div>
  </section>

  <section class="hm-sec rv">
    <div class="hm-head"><h2>今天，先看這三件事</h2><span class="mono">HIGHLIGHTS</span></div>
    <div class="hm-grid3">${hi.map(h => `<button class="hm-card" data-go="${h[0]}"><span class="tag">${h[1]}</span><span class="k">${h[2]}</span><span class="v">${h[3]}</span><p>${h[4]}</p></button>`).join('')}</div>
  </section>

  <section class="hm-sec rv">
    <div class="hm-head"><h2>六個視角，看懂整間店</h2><span class="mono">EXPLORE</span></div>
    <div class="hm-tiles">${SECTIONS.slice(1).map(x => `<button class="hm-tile" data-go="${x.id}"><span class="ico">${x.icon}</span><span><b>${x.name}</b><small>${x.sub}</small></span><span class="ar">→</span></button>`).join('')}</div>
  </section>
  <p class="hm-foot">本頁數字皆為示範用假資料</p>`;

  $('home').querySelectorAll('.node').forEach(g => {
    const i = +g.dataset.i, s = stores[i];
    const on = () => { hoverI = i; setCore(s.name + ' · 近 30 天', w1(s.revenue), `萬元\n${fmt(s.orders)} 筆訂單 · 客單價 ${money(s.ticket).replace(' ', '\u00a0')}`); };
    const off = () => { hoverI = -1; coreDefault(); };
    g.addEventListener('mouseenter', on); g.addEventListener('mouseleave', off);
    g.addEventListener('focus', on); g.addEventListener('blur', off);
    g.addEventListener('click', () => go('overall'));
  });
  coreDefault(); positionNodes();
}
function positionNodes() {
  document.querySelectorAll('#home .node').forEach(g => {
    const a = (+g.dataset.i * 60 + orbitAngle - 90) * Math.PI / 180;
    g.setAttribute('transform', `translate(${(300 + Math.cos(a) * ORBIT_R).toFixed(1)},${(300 + Math.sin(a) * ORBIT_R).toFixed(1)})`);
  });
}
function orbitFrame(ts) {
  if (current !== 'home') return;
  const dt = Math.min(50, ts - orbitLast) / 1000; orbitLast = ts;
  if (hoverI < 0) { orbitAngle += dt * 5; positionNodes(); }
  orbitRAF = requestAnimationFrame(orbitFrame);
}
function countUp() {
  cancelAnimationFrame(countRAF);
  const t0 = performance.now();
  const step = ts => {
    const k = REDUCED ? 1 : Math.min(1, (ts - t0) / 1500), e = 1 - Math.pow(1 - k, 3);
    if (hoverI < 0) $('coreNum').textContent = w1(totalRevenue * e);
    if (k < 1) countRAF = requestAnimationFrame(step);
  };
  countRAF = requestAnimationFrame(step);
}
function enterHome() {
  const hero = $('home').querySelector('.hm-hero');
  hero.classList.remove('play'); void hero.offsetWidth; hero.classList.add('play');
  countUp();
  cancelAnimationFrame(orbitRAF); orbitLast = performance.now();
  if (!REDUCED) orbitRAF = requestAnimationFrame(orbitFrame);
  if (io) io.disconnect();
  const items = $('home').querySelectorAll('.rv');
  items.forEach(el => el.classList.remove('in'));
  if (REDUCED || !window.IntersectionObserver) { items.forEach(el => el.classList.add('in')); return; }
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .15 });
  items.forEach(el => io.observe(el));
}
function go(id) {
  current = id; render();
  document.querySelector('main').scrollTop = 0; window.scrollTo(0, 0);
  const b = document.querySelector(`.nav-btn[data-id="${id}"]`);
  if (b) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}
document.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });
buildHome();

$('nav').innerHTML = SECTIONS.map(s => `<button class="nav-btn" data-id="${s.id}" title="${s.name}"><span class="ico">${s.icon}</span><span class="nav-label">${s.name}</span></button>`).join('');
$('nav').addEventListener('click', e => {
  const b = e.target.closest('.nav-btn'); if (!b) return;
  go(b.dataset.id);
});
$('collapseBtn').addEventListener('click', () => {
  const c = $('sidebar').classList.toggle('collapsed');
  $('collapseBtn').textContent = c ? '⇥' : '⇤';
  $('collapseBtn').setAttribute('aria-label', c ? '展開側欄' : '收合側欄');
});

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  $('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
  $('themeText').textContent = theme === 'dark' ? '白天模式' : '黑夜模式';
  if (window.Chart) Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  updateParticles();
  render();
}
$('themeBtn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('dash-theme-v2', theme); } catch (e) {}
  applyTheme();
});

/* ========== 6. three.js 背景粒子（低透明度、在內容後方，不遮擋數字） ========== */
let updateParticles = () => {};
(function initBackground() {
  if (!window.THREE) return;
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: $('bg'), alpha: true, antialias: true }); } catch (e) { return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 1, 2000);
  camera.position.z = 420;

  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(.4, 'rgba(255,255,255,.5)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  const sprite = new THREE.CanvasTexture(cv);

  function cloud(count, size) {
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - .5) * 1400;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size, map: sprite, transparent: true, depthWrite: false }));
    scene.add(pts); return pts;
  }
  const small = window.innerWidth < 760;
  const A = cloud(small ? 350 : 800, 7), B = cloud(small ? 120 : 260, 13);

  updateParticles = () => {
    const t = T(), hm = false;
    A.material.color.setHex(hm ? 0xffffff : t.p1); B.material.color.setHex(hm ? 0xd9a7ff : t.p2);
    A.material.opacity = hm ? 0.85 : t.opacity; B.material.opacity = (hm ? 0.85 : t.opacity) * .8;
    A.material.blending = B.material.blending = (hm || t.additive) ? THREE.AdditiveBlending : THREE.NormalBlending;
    A.material.needsUpdate = B.material.needsUpdate = true;
  };
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  let mx = 0, my = 0;
  addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tick(ms) {
    const t = ms * 0.00005;
    A.rotation.y = t; A.rotation.x = t * .4; B.rotation.y = -t * 1.6; B.rotation.x = t * .7;
    camera.position.x += (mx * 80 - camera.position.x) * .03;
    camera.position.y += (-my * 80 - camera.position.y) * .03;
    camera.lookAt(scene.position);
    renderer.render(scene, camera);
    if (!still) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

applyTheme();
</script>
</body>
